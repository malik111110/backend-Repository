version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: amal_postgres
    restart: always
    environment:
      POSTGRES_USER: amal_user
      POSTGRES_PASSWORD: amal_password
      POSTGRES_DB: amal_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amal_user -d amal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: amal_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://amal_user:amal_password@db:5432/amal_db
      - SECRET_KEY=amal-dev-secret-key-change-in-production
      - MATCH_RADIUS_KM=30.0
      - MIN_DONATION_INTERVAL_DAYS=56
      - SCHEDULER_INTERVAL_MINUTES=15
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
